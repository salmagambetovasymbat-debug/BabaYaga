<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Одна на восемь миллиардов: Баба-яга</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap');
:root{--ink:#eee8d8;--muted:#c0b69d;--gold:#d8b66c;--moss:#83916b;--panel:rgba(22,29,24,.88);--line:rgba(226,203,145,.24)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Manrope,system-ui,sans-serif;background:#101914;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(7,13,11,.22),#101914 88%),radial-gradient(ellipse at 50% 5%,#52664d 0,transparent 45%),linear-gradient(135deg,#17251d,#28352a 45%,#101914)}
body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.16;background-image:radial-gradient(#e7d7ae 0.6px,transparent .7px);background-size:7px 7px;pointer-events:none}
button{font:inherit;cursor:pointer;color:inherit}.wrap{max-width:1040px;margin:auto;padding:22px 18px 50px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);letter-spacing:.04em}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.smallbtn,.choice,.mainbtn{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;transition:.2s}.smallbtn:hover,.choice:hover,.mainbtn:hover{background:rgba(216,182,108,.15);border-color:var(--gold);transform:translateY(-1px)}
.hero{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:linear-gradient(120deg,rgba(16,26,20,.93),rgba(34,47,35,.8));box-shadow:0 22px 70px #0006}
.hero-art{height:250px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 90%,#6b704a 0,transparent 35%),linear-gradient(180deg,#24372f,#18251e 70%,#101914)}
.moon{position:absolute;width:78px;height:78px;border-radius:50%;background:#e7d8a8;right:13%;top:28px;box-shadow:0 0 50px #e7d8a855}
.tree{position:absolute;bottom:-8px;width:150px;height:200px;background:#101914;clip-path:polygon(48% 0,63% 30%,57% 30%,79% 57%,66% 55%,100% 91%,59% 83%,55% 100%,44% 100%,41% 83%,0 92%,29% 56%,15% 58%,38% 30%,31% 30%);opacity:.95}
.tree.t1{left:2%;transform:scale(1.2)}.tree.t2{right:0;transform:scale(1.45)}.tree.t3{left:23%;transform:scale(.82);opacity:.8}
.hut{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:190px;height:125px;background:linear-gradient(135deg,#76583b,#3f3429);border:3px solid #261f19;clip-path:polygon(50% 0,100% 36%,92% 100%,8% 100%,0 36%);filter:drop-shadow(0 8px 8px #0008)}
.hut:before{content:"";position:absolute;inset:27px 18px 0;background:repeating-linear-gradient(0deg,#63452f 0 12px,#4c3829 13px 16px)}
.roof{position:absolute;left:calc(50% - 112px);bottom:126px;width:224px;height:95px;background:linear-gradient(145deg,#98744a,#463727);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 3px 5px #000)}
.leg{position:absolute;bottom:0;width:18px;height:58px;background:#aa9867;border:2px solid #564a35;clip-path:polygon(30% 0,70% 0,75% 65%,100% 100%,65% 90%,50% 75%,35% 100%,0 100%,25% 65%)}.leg.l{left:calc(50% - 45px);transform:rotate(7deg)}.leg.r{left:calc(50% + 28px);transform:rotate(-7deg)}
.window{position:absolute;bottom:78px;left:calc(50% - 60px);width:22px;height:28px;background:#e7b96b;border:3px solid #35291f;box-shadow:0 0 20px #e7b96b}
.cat{position:absolute;bottom:22px;left:calc(50% + 110px);font-size:34px;filter:drop-shadow(0 4px 4px #000)}
.hero-copy{padding:28px clamp(20px,5vw,48px) 34px;text-align:center}.eyebrow{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:11px;font-weight:700}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600}h1{font-size:clamp(38px,7vw,64px);line-height:.98;margin:12px 0;color:#f2e8d2}h2{font-size:clamp(30px,5vw,42px);margin:0 0 8px}h3{font-size:25px;margin:0 0 8px}.sub{max-width:680px;margin:0 auto 24px;color:#d2c9b5;line-height:1.7}.mainbtn{background:linear-gradient(135deg,#c49a50,#8f713e);color:#1d2119;border:0;font-weight:800;padding:14px 25px}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:420px;margin:16px auto 0}.menu-grid button{padding:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:0 18px 55px #0005}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
.progress{height:5px;background:#ffffff18;border-radius:8px;overflow:hidden;margin:0 0 22px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#9aab78,#e0c27b);width:0;transition:width .3s}
.scene{height:210px;border-radius:15px;margin:0 0 22px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 100%,#758052,transparent 50%),linear-gradient(160deg,#334a3b,#1a2a21 70%);border:1px solid #ffffff1c}
.scene:before,.scene:after{content:"";position:absolute;bottom:-25px;width:160px;height:190px;background:#0c1712;clip-path:polygon(50% 0,63% 32%,100% 90%,58% 78%,50% 100%,40% 78%,0 90%,37% 32%);opacity:.8}.scene:before{left:3%}.scene:after{right:3%;transform:scale(1.2)}
.scene .symbol{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);font-size:76px;filter:drop-shadow(0 8px 10px #0008)}
.scene .spark{position:absolute;z-index:1;color:#ead69b;font-size:18px;animation:float 4s ease-in-out infinite}.s1{left:20%;top:25%}.s2{right:21%;top:18%;animation-delay:1s}.s3{left:30%;bottom:18%;animation-delay:2s}
@keyframes float{50%{transform:translateY(-12px);opacity:.5}}
.story{font-size:16px;line-height:1.85;color:#e2dac8;white-space:pre-line}.dialogue{color:#e8c981;font-family:'Cormorant Garamond',serif;font-size:23px;line-height:1.4;margin:16px 0}
.choices{display:grid;gap:10px;margin-top:22px}.choice{text-align:left;padding:15px 17px;line-height:1.5;background:#ffffff09}.choice:before{content:"✦";color:var(--gold);margin-right:10px}
.note{color:var(--muted);font-size:12px;line-height:1.6;margin-top:18px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:16px;align-items:start}.side{display:grid;gap:12px}.sidebox{background:#17231cdd;border:1px solid var(--line);border-radius:16px;padding:16px}.sidebox h3{font-size:20px;color:var(--gold)}.sidebox p{font-size:13px;line-height:1.6;color:#d2c9b5;margin:7px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:11px;color:#d7c69e;margin:3px 3px 0 0}
.overlay{position:fixed;inset:0;background:#07100ddd;display:none;place-items:center;padding:16px;z-index:5}.overlay.show{display:grid}.modal{max-width:620px;width:100%;max-height:85vh;overflow:auto;background:#1b2920;border:1px solid var(--line);border-radius:18px;padding:24px}.modal p,.modal li{line-height:1.7;color:#ddd4c1}.modalhead{display:flex;justify-content:space-between;align-items:center}
.logitem{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}.ending{text-align:center}.ending .symbol{font-size:64px;margin:10px}.ending blockquote{font-family:'Cormorant Garamond',serif;font-size:26px;color:#e7ca88;margin:20px 0}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebox:last-child{grid-column:1/-1}.hero-art{height:210px}.top{align-items:flex-start}.brand{max-width:190px}}@media(max-width:430px){.side{grid-template-columns:1fr}.sidebox:last-child{grid-column:auto}.menu-grid{grid-template-columns:1fr}.scene{height:170px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand">✧ Сказания старого леса</div><div class="top-actions"><button class="smallbtn" onclick="openModal('journal')">Летопись</button><button class="smallbtn" onclick="openModal('about')">Об игре</button></div></header>
<main id="app"></main>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Летопись</h2><button class="smallbtn" onclick="closeModal()">Закрыть ✕</button></div><div id="modalBody"></div></div></div>
<script>
const mainEvents=[
[0,5,"Первое знакомство с магией","В старой кладовой пахнет сушёной мятой и грозой. На полу лежит метла, рядом дымится неизвестное зелье, а из корзины на тебя смотрит маленький чёрный котёнок.","🧹",[
["Оседлать метлу и попробовать взлететь","Метла взвизгивает, поднимает тебя под потолок и гордо выносит обратно. Мама только вздыхает: «У нашей семьи даже падения получаются с размахом».",{c:0,w:1,flag:"broom"}],
["Осторожно попробовать зелье","На языке вспыхивает вкус черники и грома. Ты понимаешь язык мышей — и узнаёшь, что кладовая давно просит ремонта.",{w:1,k:1,flag:"potion"}],
["Взять котёнка и заговорить с ним","Котёнок отвечает хриплым «мур», а потом сообщает, что его зовут Уголь. Он выбирает тебя своей хозяйкой.",{c:2,flag:"cat"}]]],
[0,5,"Незнакомец у порога","В снежную ночь кто-то стучит в дверь. На пороге дрожит лесной гном, весь в инею. «Пустите погреться. Дорога нынче злая».","🧙",[
["Пригласить его на чай","Гном согревается и рассказывает о тайных тропах. Мама напоминает: доброта не отменяет осторожности.",{c:2,w:1,rel:"gnome"}],
["Спросить, что он может предложить взамен","«Честная сделка!» — радуется гном. Он оставляет медную пуговицу, которая звенит рядом с потерянными вещами.",{k:1,w:1,flag:"button"}],
["Спрятаться за занавеской","Гном уходит, оставив на крыльце следы маленьких звёзд. Ты запоминаешь: не каждый стук требует ответа.",{w:1}]]],
[0,5,"Первый подарок","К пяти годам ты уже умеешь отличать шёпот ветра от шёпота старых заклинаний. Мама предлагает выбрать подарок на память о детстве.","🎁",[
["Старинную книгу заклинаний","На полях книги почерком прабабушки написано: «Сила без понимания — просто шум».",{w:2,flag:"book"}],
["Метлу, которая летает сама","Метла оказывается упрямой, но верной. Она любит скорость и совершенно не уважает расписание.",{k:1,flag:"broom"}],
["Зеркало, показывающее прошлое","В зеркале мелькают женщины твоего рода: каждая жила по собственным правилам.",{w:1,c:1,flag:"mirror"}]]],
[6,12,"Экзамен по зельеварению","На школьном экзамене ты перепутала два пузырька. Весь класс, включая строгого директора, теперь разговаривает рифмами. Даже скелет в шкафу читает рэп.","⚗️",[
["Признаться и исправить ошибку","Ты находишь противоядие, а директор впервые хвалит не результат, а честность.",{w:2,c:1}],
["Объявить это новым заклинанием","«Так и задумано!» — уверенно говоришь ты. Одноклассники аплодируют, хотя директор просит научную запись рецепта.",{k:2,r:1}],
["Свалить всё на кота","Уголь демонстративно отворачивается. Он не выдаёт тебя, но вечером перестаёт приносить тапочки.",{k:1,c:-1,flag:"cat_miffed"}]]],
[6,12,"Пропавший дневник","Маленький леший утащил твой дневник. Он не хотел навредить — просто пытался разобраться в заклинаниях, которые ты записывала.","📖",[
["Предложить учиться вместе","Вы читаете записи вдвоём. Леший становится первым другом, который спорит с тобой на равных.",{c:2,w:1,rel:"leshy"}],
["Забрать дневник и предупредить его","Ты объясняешь, что чужие вещи нельзя брать без спроса. Леший краснеет и обещает спрашивать.",{w:2,r:1,rel:"leshy"}],
["Рассказать всем, что он вор","Леший возвращает дневник, но больше не подходит к твоему столу. Слухи в школе растут быстрее грибов.",{k:1,r:-1}]]],
[6,12,"Потерявшийся дракончик","На опушке ты находишь грязного дракончика. Он дрожит, не умеет летать и чихает маленькими огненными облачками. На шее — обрывок красной ленты.","🐉",[
["Позаботиться о нём и найти родителей","Ты отмываешь дракончика, лечишь крыло и находишь его семью у каменного ущелья. Мать-драконица дарит чешуйку на удачу.",{c:2,w:1,flag:"dragon"}],
["Научить его летать","После нескольких неудач дракончик взмывает над лесом. Он возвращается к семье сам — гордый и самостоятельный.",{w:2,k:1,flag:"dragon"}],
["Оставить еду и уйти","Ты не вмешиваешься в чужую историю, но оставляешь след из ягод до безопасной тропы.",{w:1}]]],
[13,20,"Избушка с характером","Унаследованная избушка на двух курьих ножках отказывается идти. «Мне нужны новая крыша, занавески и выходной!» — заявляет она.","🏚️",[
["Согласиться на все требования","Избушка сияет свежими занавесками и начинает называть тебя «уважаемая хозяйка».",{c:2,rel:"hut"}],
["Договориться о расписании","Вы составляете договор: работа, отдых и ремонт по очереди. Избушка признаёт в тебе разумного руководителя.",{w:2,rel:"hut"}],
["Приказать ей работать","Избушка всё-таки шагает, но каждую кочку сопровождает недовольным скрипом.",{k:1,r:-1,rel:"hut"}]]],
[13,20,"Мальчик, потерявшийся в бурю","В грозу в дверь стучит промокший мальчик. Он сбился с дороги и старается не показывать страх. За его спиной лес шепчет чужими голосами.","🌧️",[
["Впустить, напоить чаем и помочь найти дорогу","Ты согреваешь его и рисуешь карту на обороте старой сказки. Мальчик обещает однажды вернуться и рассказать, кем стал.",{c:2,w:1,flag:"boy_helped",rel:"boy"}],
["Показать направление, не приглашая внутрь","Ты указываешь безопасную тропу и даёшь фонарь. Он уходит увереннее, чем пришёл.",{w:1,r:1,flag:"boy_known",rel:"boy"}],
["Оставить до утра и расспросить, что случилось","Мальчик рассказывает, что хотел доказать свою смелость. Утром вы вместе находите дорогу.",{c:1,w:2,flag:"boy_helped",rel:"boy"}]]],
[13,20,"Предложение тёмного волшебника","Незнакомый волшебник предлагает невероятную силу в обмен на одно воспоминание из детства. На столе уже лежит договор с чернильной печатью.","📜",[
["Отказаться","«Не всё продаётся», — говоришь ты. Волшебник исчезает, оставив запах холодного железа.",{w:2,r:1,flag:"wizard_refused"}],
["Согласиться только после чтения договора","Мелкий шрифт оказывается длиннее самой жизни. Ты замечаешь лазейку и сохраняешь право на собственные воспоминания.",{k:2,w:1,flag:"contract"}],
["Предложить обмен воспоминаниями","Ты предлагаешь честный обмен. Волшебник неожиданно отступает: своё прошлое он беречь умеет.",{k:2,w:1,flag:"contract"}]]],
[21,35,"Дело или милосердие","Волшебные растения в округе заболели. Ты знаешь лекарство, но редкие ингредиенты стоят дорого, а соседям нечем платить.","🌿",[
["Помочь бесплатно","Растения оживают. Через годы жители будут помнить этот поступок, но лавка почти разоряется.",{c:2,r:2,forest:1}],
["Назначить справедливую цену","Ты объясняешь стоимость работы и берёшь ровно столько, сколько нужно. Люди уважают твоё мастерство.",{w:2,r:1}],
["Назначить высокую цену","Лавка быстро богатеет. Некоторые клиенты больше не возвращаются, зато у тебя появляется запас редких ингредиентов.",{k:2,r:-2,flag:"rich"}]]],
[21,35,"Ведьма-соперница","По соседству открывается лавка молодой ведьмы Мирославы. У неё яркая вывеска, громкая реклама и подозрительно знакомые рецепты.","🪄",[
["Предложить сотрудничество","Мирослава соглашается делить заказы и знания. Конкуренция превращается в партнёрство.",{c:1,w:2,rel:"miroslava"}],
["Улучшить собственную лавку","Ты обновляешь вывеску, ассортимент и правила. Клиенты выбирают не шум, а качество.",{k:1,w:1,r:1}],
["Разузнать её секреты и использовать их","Ты находишь слабое место соперницы и выигрываешь несколько заказов. Но Мирослава запоминает это.",{k:2,r:-1,rel:"miroslava"}]]],
[21,35,"Исчезающий лес","Древний дух предупреждает: человеческая деревня расширяет поля, и часть леса может исчезнуть. «Не всякий человек враг, но молчание тоже выбор».","🌲",[
["Объединить жителей леса","Лешие, русалки и звери создают общий совет. Лес получает защитников, но теперь тебе приходится их координировать.",{c:2,w:2,forest:2}],
["Поговорить с деревней","Ты договариваешься о границах и новых тропах. Не все довольны, зато появляется шанс на мир.",{w:2,r:1,forest:1}],
["Не вмешиваться","Ты сохраняешь силы для своих дел. Через время знакомая поляна выглядит иначе.",{k:1,forest:-2}]]],
[36,50,"Предложение лесного духа","Древний дух предлагает стать хранительницей леса. Взамен придётся отдать часть личной магии и связать судьбу с этим местом.","🍃",[
["Принять","Ты чувствуешь, как корни леса отзываются на твой голос. Свобода теперь означает и ответственность.",{c:2,w:2,forest:2,flag:"guardian"}],
["Попросить время подумать","Дух оставляет знак на ладони и обещает вернуться. Ты не позволяешь даже древним силам торопить себя.",{w:2,k:1}],
["Отказаться","«Я могу любить лес, не становясь его собственностью», — отвечаешь ты. Дух уважает прямоту.",{k:2,w:1}]]],
[36,50,"Предательство старого друга","Леший раскрывает людям местоположение избушки, пытаясь спасти собственный дом от вырубки. Теперь к твоему порогу идут чужие следы.","🍂",[
["Простить и решить проблему вместе","Леший помогает отвести людей от опасной части леса. Доверие не возвращается мгновенно, но появляется путь назад.",{c:2,w:1,rel:"leshy",forest:1}],

const state={age:0,index:0,done:[],flags:{},rels:{},items:[],log:[],kind:0,wisdom:0,cunning:0,rep:0,forest:0,cat:0,ending:null,extraSeen:[],settings:{text:true}};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem('babaYagaSave',JSON.stringify(state))}catch(e){}}
function load(){try{let x=JSON.parse(localStorage.getItem('babaYagaSave'));if(x&&Array.isArray(x.done))Object.assign(state,x)}catch(e){}}
function chapter(age){if(age<=5)return"Рождение";if(age<=12)return"Детство";if(age<=20)return"Юность";if(age<=35)return"Взрослая жизнь";if(age<=50)return"Зрелость";if(age<=70)return"Старость";if(age<100)return"Легенда леса";return"Последний год"}
function scene(emoji){return `<div class="scene"><span class="spark s1">✧</span><span class="spark s2">✦</span><span class="spark s3">·</span><div class="symbol">${emoji}</div></div>`}
function showMenu(){menu=true;document.getElementById('app').innerHTML=`<section class="hero"><div class="hero-art"><div class="moon"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="roof"></div><div class="hut"></div><div class="window"></div><div class="leg l"></div><div class="leg r"></div><div class="cat">🐈‍⬛</div></div><div class="hero-copy"><div class="eyebrow">Интерактивная сказка о свободе и выборе</div><h1>Одна на восемь<br>миллиардов</h1><h2 style="color:#d7b978">Баба-яга</h2><p class="sub">Сто лет жизни. Двадцать одна судьбоносная история. Ты решаешь, какой станет легенда — и что останется за пределами чужих сказок.</p><button class="mainbtn" onclick="startNew()">Начать новую жизнь</button><div class="menu-grid"><button class="smallbtn" onclick="continueGame()" ${state.done.length?'':'disabled style="opacity:.35"'}>Продолжить</button><button class="smallbtn" onclick="openModal('settings')">Настройки</button><button class="smallbtn" onclick="openModal('about')">Об игре</button><button class="smallbtn" onclick="openModal('journal')">Летопись</button></div></div></section>`}
function startNew(){if(state.done.length&&!confirm('Начать новую жизнь? Прежняя летопись будет заменена.'))return;Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,{age:0,index:0,done:[],flags:{},rels:{},items:[],log:[],kind:0,wisdom:0,cunning:0,rep:0,forest:0,cat:0,ending:null,extraSeen:[],settings:{text:true}});save();menu=false;renderEvent(0)}
function continueGame(){menu=false;if(state.ending){renderEnding();return}if(state.done.length>=21){renderFinalChoice();return}renderEvent(state.done.length)}
function addLog(t){state.log.push({age:state.age,text:t});if(state.log.length>100)state.log.shift()}
function apply(e,choice){let d=e[5][choice][2]||{};state.kind+=d.c||0;state.wisdom+=d.w||0;state.cunning+=d.k||0;state.rep+=d.r||0;state.forest+=d.forest||0;if(d.flag)state.flags[d.flag]=true;if(d.rel)state.rels[d.rel]=true;if(d.flag==='cat')state.cat=1;if(d.flag==='dragon')state.items.push('Чешуйка дракона');if(d.flag==='book')state.items.push('Старинная книга заклинаний');if(d.flag==='mirror')state.items.push('Зеркало прошлого');if(d.flag==='button')state.items.push('Медная пуговица-поисковик');let response=e[5][choice][1];addLog(`«${e[2]}» — ${e[5][choice][0]}. ${response}`);state.done.push(e[2]);state.age=Math.max(state.age,e[0]);save();return response}
function renderEvent(i){let e=mainEvents[i];if(!e){renderFinalChoice();return}current={type:'main',i};state.age=Math.max(state.age,e[0]);let pct=(i/21)*100;document.getElementById('app').innerHTML=`<div class="meta"><span>${chapter(e[0])} · ${e[0]}–${e[1]} лет</span><span>Глава ${Math.min(7,Math.floor(i/3)+1)} из 7</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="layout"><section class="panel">${scene(e[4])}<div class="eyebrow">История ${i+1} из 21</div><h2>${e[2]}</h2><div class="story">${e[3]}</div><div class="choices">${e[5].map((c,j)=>`<button class="choice" onclick="chooseMain(${i},${j})">${c[0]}</button>`).join('')}</div><p class="note">Твои решения остаются в летописи. Некоторые последствия проявятся спустя годы.</p></section>${sidePanel()}</div>`}
function chooseMain(i,j){let e=mainEvents[i],response=apply(e,j);if(i===8){state.flags.vasilisa=true;addLog('Василиса Прекрасная приходит за огнём. Её кукла шепчет ей советы.');save();renderSpecial('Василиса Прекрасная', 'Василиса стоит у порога с маленькой куклой в кармане. Ей нужен огонь черепа, чтобы вернуться домой. Она не просит сделать всё за неё — только дать шанс.', '🪆', [['Испытать её: поручить три трудных дела',()=>{state.wisdom+=2;state.flags.vasilisa_test=true;addLog('Василиса прошла испытания и поняла цену терпения.');}],['Помочь ей и объяснить, как выбирать самой',()=>{state.kind+=2;state.flags.vasilisa_help=true;addLog('Ты помогла Василисе, но оставила ей право решать самой.');}],['Отказать: пусть ищет другой путь',()=>{state.cunning+=1;addLog('Ты отказала Василисе. Она ушла искать иной путь.');}]]);return}if(i===11){renderSpecial('Иван-царевич и клубок', 'Иван-царевич ищет волшебный клубок, который приведёт его к Марье Моревне и тайне Кощея. Он привык, что ему указывают дорогу, но умеет ли он слушать?', '🧶', [['Дать клубок и предупредить об опасности',()=>{state.kind+=1;state.wisdom+=1;state.flags.ivan_help=true;state.rels.ivan=true;}],['Проверить его характер загадкой',()=>{state.wisdom+=2;state.flags.ivan_test=true;state.rels.ivan=true;}],['Пусть найдёт дорогу сам',()=>{state.cunning+=1;state.flags.ivan_solo=true;state.rels.ivan=true;}]]);return}if(i===14){renderSpecial('Кощей Бессмертный', 'Кощей появляется в дверях с предложением союза. Он говорит вежливо, но его тень движется чуть позже него самого.', '💀', [['Принять союз, оставив за собой право выйти',()=>{state.cunning+=2;state.flags.koschei_alliance=true;state.rels.koschei=true;}],['Сделать вид, что согласна, и изучить его замысел',()=>{state.cunning+=2;state.wisdom+=1;state.flags.koschei_deceived=true;state.rels.koschei=true;}],['Отказаться',()=>{state.wisdom+=1;state.flags.koschei_refused=true;}]]);return}if(i===15){renderSpecial('Молодильные яблоки', 'На ветке висят три золотых яблока. Они function afterMain(i){if(i===2){state.age=5;addLog('В пять лет пришло приглашение в школу магии.');}if(i===5){state.age=12;state.flags.hut=true;addLog('В двенадцать лет ты окончила школу магии и унаследовала старую избушку.');}if(i===8){state.age=20;addLog('В двадцать лет ты стала полноправной ведьмой и открыла магическую лавку.');}if(i===11){state.age=35;addLog('В тридцать пять лет о тебе заговорили далеко за пределами леса.');}if(i===14){state.age=50;addLog('В пятьдесят лет ты получила загадочное письмо о повороте судьбы.');}if(i===17){state.age=70;}if(i===20){state.age=99;}save();if(i<20){if((i+1)%2===0&&Math.random()<.8)renderExtra();else renderEvent(i+1)}else renderFinalChoice()}
function renderSpecial(title,desc,emoji,opts){current={type:'special'};document.getElementById('app').innerHTML=`<div class="layout"><section class="panel">${scene(emoji)}<div class="eyebrow">Сказочная встреча</div><h2>${title}</h2><div class="story">${desc}</div><div class="choices">${opts.map((o,i)=>`<button class="choice" onclick="specialPick(${i})">${o[0]}</button>`).join('')}</div></section>${sidePanel()}</div>`;window.specialOpts=opts}
function specialPick(i){let o=window.specialOpts[i];o[1]();addLog(`Сказочная встреча: ${o[0]}.`);save();let idx=state.done.length-1;afterMain(idx)}
function renderExtra(){let available=extras.filter((e,i)=>!state.extraSeen.includes(i));if(!available.length){renderEvent(state.done.length);return}let e=available[Math.floor(Math.random()*available.length)],idx=extras.indexOf(e);state.extraSeen.push(idx);current={type:'extra',idx};document.getElementById('app').innerHTML=`<div class="layout"><section class="panel">${scene(e[2])}<div class="eyebrow">Случай из жизни · необязательная история</div><h2>${e[0]}</h2><div class="story">${e[1]}</div><div class="choices">${e[3].map((o,j)=>`<button class="choice" onclick="pickExtra(${idx},${j})">${o[0]}</button>`).join('')}</div></section>${sidePanel()}</div>`}
function pickExtra(idx,j){let e=extras[idx],d=e[3][j][1];state.kind+=d.c||0;state.wisdom+=d.w||0;state.cunning+=d.k||0;state.rep+=d.r||0;state.forest+=d.forest||0;addLog(`Дополнительная история «${e[0]}»: ${e[3][j][0]}.`);save();renderEvent(state.done.length)}
function sidePanel(){return `<aside class="side"><div class="sidebox"><h3>Твой путь</h3><p>Возраст: <b>${state.age} лет</b></p><p>Глава: ${chapter(state.age)}</p><p>Пройдено главных историй: ${state.done.length}/21</p></div><div class="sidebox"><h3>Спутники</h3><p>${state.cat?'🐈‍⬛ Уголь — рядом':'🐈‍⬛ Кот пока не выбран'}</p><p>${state.rels.leshy?'🌿 Леший знаком':'🌿 Леший ещё не друг'}</p><p>${state.rels.hut?'🏚️ Избушка с характером':'🏚️ Избушка ждёт хозяйку'}</p></div><div class="sidebox"><h3>Вещи и знаки</h3><p>${state.items.length?state.items.map(esc).join(' · '):'Пока только то, что ты носишь с собой.'}</p></div></aside>`}
function renderFinalChoice(){state.age=100;save();current={type:'final'};document.getElementById('app').innerHTML=`<div class="layout"><section class="panel">${scene('🌌')}<div class="eyebrow">Глава VIII · Сто лет</div><h2>Последний год</h2><div class="story">Тебе сто лет. За окном избушки лес шумит так же, как в детстве, но теперь ты различаешь в его голосе все прожитые годы. На пороге появляется древний дух.

«Ты прожила целую жизнь, Яга. Но история не обязана заканчиваться там, где её привыкли заканчивать другие. Выбери, что будет дальше».</div><div class="choices"><button class="choice" onclick="finish('guardian')">Стать вечной хранительницей леса</button><button class="choice" onclick="finish('pass')">Передать магию следующему поколению и мирно завершить историю</button><button class="choice" onclick="finish('space')">Отправиться в неизвестный мир и начать новую жизнь</button></div><p class="note">Последний выбор соединится со всеми решениями, которые ты принимала за сто лет.</p></section>${sidePanel()}</div>`}
function finish(path){state.flags.finalPath=path;let score={forest:state.forest,kind:state.kind,wisdom:state.wisdom,cunning:state.cunning,rep:state.rep};let ending;
if(path==='space'&&(state.cat||state.cunning+state.wisdom>state.kind+state.forest))ending='space';
else if(state.cat&&state.kind>=4&&state.flags.apple_saved)ending='cats';
else if(state.flags.legacy_book&&state.wisdom>=7)ending='student';
else if(path==='guardian'&&state.forest>=4&&state.kind>=4)ending='forest';
else if(state.rep<=-2&&state.cunning+state.kind>=state.wisdom+state.kind/2)ending='alone';
else if(path==='pass'&&state.flags.student)ending='student';
else ending='life';
state.ending=ending;addLog('В сто лет Баба-яга выбрала свой дальнейший путь.');save();renderEnding()}
const endings={
forest:['Та, которую помнит лес','🌳','Лесные жители собрались у избушки. Лешие принесли мёд, русалки — жемчуг, а старые деревья склонили ветви. Ты стала не хозяйкой леса, а его голосом и защитой.','Настоящая магия заключается не в заклинаниях, а в поступках.'],
alone:['Самая одинокая ведьма','🕯️','Ты добилась могущества и научилась получать желаемое. Но в избушке стало тихо: старые друзья больше не стучат, ученики выбрали другие дороги. Даже эхо отвечает не сразу.','Она смогла управлять магией, но так и не научилась понимать других.'],
life:['Жизнь как жизнь','🏡','Ты открыла гостиницу для волшебных существ. Здесь спорят гномы, отдыхают драконы, а на кухне всегда пахнет пирогами. Не все решения были удачными — зато каждый год был твоим.','Не каждая история должна быть идеальной. Главное — чтобы она была твоей.'],
space:['Космическая бабушка','🚀','Ты собрала ступу с межзвёздным двигателем и отправилась исследовать дальние миры. Уголь занял кресло капитана и запретил кормить его земной гречкой.','Земля была слишком маленькой для её амбиций.'],
cats:['Королева кошек','🐈','Ты стала покровительницей кошек. Их оказалось ровно 147, и каждый считает себя главным. Уголь назначен министром сна и уже отменил утренние совещания.','Она мечтала управлять миром. В итоге миром управляли коты.'],
student:['Вечная студентка','🎓','Ты поступила в магический университет и продолжила исследовать древние заклинания. В сто лет ты снова сидишь на экзамене. Профессор дрожит сильнее студентов.','Некоторые заканчивают учиться в 18 лет. Яга решила, что это слишком рано.']
};
function renderEnding(){let e=endings[state.ending]||endings.life;let personality=state.kind>state.cunning?'Сердечная, но умеющая говорить «нет»':state.cunning>state.wisdom?'Хитрая стратегиня, которая любит свободу манёвра':state.wisdom>=state.kind?'Наблюдательная хранительница знаний':'Независимая женщина со своими правилами';document.getElementById('app').innerHTML=`<section class="panel ending">${scene(e[1])}<div class="eyebrow">Конец одной истории · начало легенды</div><div class="symbol">${e[1]}</div><h2>${e[0]}</h2><p class="story">${e[2]}</p><blockquote>«${e[3]}»</blockquote><div class="sidebox" style="text-align:left;margin:22px 0"><h3>Летопись ста лет</h3><p>Возраст: 100 лет · Пройдено основных историй: ${state.done.length}/21</p><p>Черты характера: ${personality}</p><p>Важные встречи: ${Object.keys(state.rels).filter(k=>state.rels[k]).join(', ')||'Ты чаще выбирала одиночество'}</p><p>Памятные вещи: ${state.items.join(', ')||'Не вещи определяли твою историю'}</p><p>Событий в летописи: ${state.log.length}</p></div><button class="mainbtn" onclick="openModal('journal')">Открыть полную летопись</button> <button class="smallbtn" onclick="if(confirm('Начать новую жизнь?'))startNew()">Начать заново</button></section>`}
function openModal(type){let title='',body='';if(type==='journal'){title='Летопись Бабы-яги';body=state.log.length?state.log.map(x=>`<div class="logitem"><b>${x.age} лет</b> — ${esc(x.text)}</div>`).join(''):'<p>Твоя история ещё не началась. Каждое решение появится здесь.</p>'}else if(type==='about'){title='Об игре';body=`<p>«Одна на восемь миллиардов: Баба-яга» — интерактивная сказка о ста годах жизни женщины, которую мир привык считать злой ведьмой.</p><p>Игра исследует тему женской автономности: право выбирать, отказывать, учиться, ошибаться, помогать и устанавливать собственные правила.</p><p>Все персонажи и события вдохновлены мотивами славянского фольклора, но их истории созданы специально для этой игры.</p><p><b>Управление:</b> выбирай варианты внизу истории. Решения сохраняются в этом браузере.</p>`}else{title='Настройки';body=`<p>Сохранение: <b>автоматическое</b> — прогресс хранится в памяти браузера на этом устройстве.</p><p>Звук: в этой версии музыка не включена, чтобы игра не запускалась неожиданно.</p><p><button class="smallbtn" onclick="if(confirm('Удалить сохранение и начать сначала?')){localStorage.removeItem('babaYagaSave');location.reload()}">Сбросить сохранение</button></p><p class="note">Для продолжения используй ту же вкладку/браузер. Если очистить данные браузера, сохранение может исчезнуть.</p>`}document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('overlay').classList.add('show')}
function closeModal(){document.getElementById('overlay').classList.remove('show')}
load();showMenu();
</script></body></html>
